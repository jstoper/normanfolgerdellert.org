<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Woodcut Gallery</title>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: sans-serif;
            margin: 0; /* Removes default browser spacing */
            padding: 20px; /* Adds some space around the content */
        }
        h1 { 
            text-align: center; 
        }

        /* --- Navigation Styles --- */
        nav {
            width: 100%;
            text-align: center; /* Centers the nav block */
            margin-bottom: 30px; /* Adds space below the nav */
        }
        nav ul {
            list-style-type: none; /* Removes list bullets */
            margin: 0;
            padding: 0;
            display: inline-block; /* Helps center the list */
        }
        nav li {
            display: inline-block; /* Makes the links horizontal */
        }
        nav a {
            display: block;
            color: #fff;
            text-decoration: none;
            padding: 10px 15px;
            font-weight: bold;
            transition: background-color 0.3s ease; /* Smooth hover effect */
        }
        
        /* Change background on hover/focus */
        nav a:hover, nav a:focus {
            background-color: #333; /* Dark gray background on hover */
            border-radius: 4px; /* Adds slightly rounded corners */
        }
        
        /* Style for the *current* page link */
        nav a.active {
            color: #888; /* Grays out the active link */
            cursor: default;
        }
        /* --- End Navigation Styles --- */

        .gallery { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 15px; 
            align-items: flex-start; 
        }
        
        /* * --- THUMBNAIL IMAGE STYLE --- 
         * This is the corrected style to fix the "giant" image issue.
         * I'm setting an explicit width of 300px for the thumbnails.
        */
        .gallery img { 
            width: 200px;  /* Explicitly set thumbnail width */
            height: auto; /* Maintain aspect ratio */
            display: block; 
            border: none; 
            border-radius: 4px; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); 
            transition: transform 0.3s ease, opacity 0.3s ease; 
            cursor: pointer; /* Show it's clickable */
        }

        .gallery img:hover {
            transform: scale(1.03); /* Slightly enlarge on hover */
            opacity: 0.8; /* Fade slightly */
        }
        
        /* --- Footer Style --- */
        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9em;
            color: #888;
        }

        /* * ---------------------------------
         * --- MODAL (LIGHTBOX) STYLES ---
         * ---------------------------------
         * This CSS is required for the popup to work.
        */

        /* The Modal (background) */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 1000; /* Sit on top of everything */
            padding-top: 60px; /* Location of the box */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0,0,0,0.9); /* Black w/ opacity */
        }

        /* Modal Content (The Image) */
        .modal-content {
            margin: auto;
            display: block;
            width: auto; /* Respect aspect ratio */
            max-width: 90%; /* Max width is 90% of the screen */
            max-height: 90vh; /* Max height is 90% of the viewport height */
        }

        /* Caption of Modal Image (from alt text) */
        #caption {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
            text-align: center;
            color: #ccc;
            padding: 10px 0;
        }

        /* Add Animation - Zoom in */
        .modal-content, #caption {
            animation-name: zoom;
            animation-duration: 0.5s;
        }

        @keyframes zoom {
            from {transform: scale(0.1)}
            to {transform: scale(1)}
        }

        /* The Close Button */
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <h1>Woodcut Gallery</h1>

    <nav>
        <ul>
            <li><a href="http://normanfolgerdellert.org/">Home</a></li>
            <li><a href="http://normanfolgerdellert.org/bio.html">Bio</a></li>
            <li><a href="http://normanfolgerdellert.org/woodcut/index.html" class="active">Woodcuts</a></li>
            <li><a href="http://normanfolgerdellert.org/penandink/index.html">Pen and Ink</a></li>
            <li><a href="http://normanfolgerdellert.org/watercolor/index.html">Watercolor</a></li>
        </ul>
    </nav>

    <div class="gallery">
        
        <img src="http://normanfolgerdellert.org/woodcut/images/3.jpg" alt="Village Woodcut">
        <img src="http://normanfolgerdellert.org/woodcut/images/4.jpg" alt="Horse and Rider Woodcut">
        <img src="http://normanfolgerdellert.org/woodcut/images/6.jpg" alt="Masks Woodcut">
        <img src="http://normanfolgerdellert.org/woodcut/images/7.jpg" alt="Herman Melville Woodcut">
        <img src="http://normanfolgerdellert.org/woodcut/images/8.jpg" alt="Nude Figure Woodcut">
        <img src="http://normanfolgerdellert.org/woodcut/images/9.jpg" alt="Tree Limbs Woodcut">
        <img src="http://normanfolgerdellert.org/woodcut/images/10.jpg" alt="Nathaniel Hawthorne">
        <img src="http://normanfolgerdellert.org/woodcut/images/11.jpg" alt="Beethoven Woodcut">
        <img src="http://normanfolgerdellert.org/woodcut/images/12.jpg" alt="Frederick Douglass Woodcut">
        <img src="http://normanfolgerdellert.org/woodcut/images/14.jpg" alt="Blcok Woodcut">
        <img src="http://normanfolgerdellert.org/woodcut/images/15.jpg" alt="Cotton Mather">
        <img src="http://normanfolgerdellert.org/woodcut/images/16.jpg" alt="Johannes Brahms">
        <img src="http://normanfolgerdellert.org/woodcut/images/17.jpg" alt="Voltaire Woodcut">
        <img src="http://normanfolgerdellert.org/woodcut/images/18.jpg" alt="Don Quixote and Pancho Woodcut">
        <img src="http://normanfolgerdellert.org/woodcut/images/19.jpg" alt="Chopan Woodcut">
        <img src="http://normanfolgerdellert.org/woodcut/images/20.jpg" alt="Tchaikovsky Woodcut">
        <img src="http://normanfolgerdellert.org/woodcut/images/21.jpg" alt="Freud Woodcut">
        <img src="http://normanfolgerdellert.org/woodcut/images/24.jpg" alt="Tlaloc - God of Rain Woodcut 1">
        <img src="http://normanfolgerdellert.org/woodcut/images/25.jpg" alt="Tlaloc - God of Rain Woodcut 2">
        <img src="http://normanfolgerdellert.org/woodcut/images/26.jpg" alt="Tlaloc - God of Rain Woodcut 3">
		<img src="http://normanfolgerdellert.org/woodcut/images/5.jpg" alt="Bartender Woodcut">
		<img src="http://normanfolgerdellert.org/woodcut/images/13.jpg" alt="Leo Tolstoy Woodcut">
		<img src="http://normanfolgerdellert.org/woodcut/images/2.jpg" alt="Still life Woodcut">
		<img src="http://normanfolgerdellert.org/woodcut/images/22.jpg" alt="Cityscape Woodcut 1">
        <img src="http://normanfolgerdellert.org/woodcut/images/23.jpg" alt="Cityscape Woodcut 2">

    </div>

    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        
        <img class="modal-content" id="img01">
        
        <div id="caption"></div>
    </div>


    <script>
        // Get the modal element
        var modal = document.getElementById("myModal");

        // Get the modal image and caption elements
        var modalImg = document.getElementById("img01");
        var captionText = document.getElementById("caption");

        // Get all images in the gallery
        var images = document.querySelectorAll(".gallery img");
        
        // Loop over each image and add a click event
        images.forEach(function(img) {
            img.onclick = function() {
                modal.style.display = "block"; // Show the modal
                modalImg.src = this.src;       // Set the modal image to the one clicked
                captionText.innerHTML = this.alt; // Use the alt text for the caption
            }
        });

        // Get the <span> element that closes the modal
        var span = document.getElementsByClassName("close")[0];

        // When the user clicks on <span> (x), close the modal
        span.onclick = function() {
            modal.style.display = "none";
        }

        // When the user clicks on the modal background (not the image), close it
        modal.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
