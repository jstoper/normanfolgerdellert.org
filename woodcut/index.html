<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Woodcut Gallery</title>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: sans-serif;
            margin: 0; /* Removes default browser spacing */
            padding: 20px; /* Adds some space around the content */
        }
        h1 { 
            text-align: center; 
        }

        /* --- Navigation Styles --- */
        nav {
            width: 100%;
            text-align: center; /* Centers the nav block */
            margin-bottom: 30px; /* Adds space below the nav */
        }
        nav ul {
            list-style-type: none; /* Removes list bullets */
            margin: 0;
            padding: 0;
            display: inline-block; /* Helps center the list */
        }
        nav li {
            display: inline-block; /* Makes the links horizontal */
        }
        nav a {
            display: block;
            color: #fff;
            text-decoration: none;
            padding: 10px 15px;
            font-weight: bold;
            transition: background-color 0.3s ease; /* Smooth hover effect */
        }
        
        /* Change background on hover/focus */
        nav a:hover, nav a:focus {
            background-color: #333; /* Dark gray background on hover */
            border-radius: 4px; /* Adds slightly rounded corners */
        }
        
        /* Style for the *current* page link */
        nav a.active {
            color: #888; /* Grays out the active link */
            cursor: default;
        }
        /* --- End Navigation Styles --- */

        .gallery { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 15px; 
            align-items: flex-start; 
        }
        
        /* * --- THUMBNAIL IMAGE STYLE --- 
         * This is the corrected style to fix the "giant" image issue.
         * I'm setting an explicit width of 300px for the thumbnails.
        */
        .gallery img { 
            width: 300px;  /* Explicitly set thumbnail width */
            height: auto; /* Maintain aspect ratio */
            display: block; 
            border: none; 
            border-radius: 4px; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); 
            transition: transform 0.3s ease, opacity 0.3s ease; 
            cursor: pointer; /* Show it's clickable */
        }

        .gallery img:hover {
            transform: scale(1.03); /* Slightly enlarge on hover */
            opacity: 0.8; /* Fade slightly */
        }
        
        /* --- Footer Style --- */
        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9em;
            color: #888;
        }

        /* * ---------------------------------
         * --- MODAL (LIGHTBOX) STYLES ---
         * ---------------------------------
         * This CSS is required for the popup to work.
        */

        /* The Modal (background) */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 1000; /* Sit on top of everything */
            padding-top: 60px; /* Location of the box */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0,0,0,0.9); /* Black w/ opacity */
        }

        /* Modal Content (The Image) */
        .modal-content {
            margin: auto;
            display: block;
            width: auto; /* Respect aspect ratio */
            max-width: 90%; /* Max width is 90% of the screen */
            max-height: 90vh; /* Max height is 90% of the viewport height */
        }

        /* Caption of Modal Image (from alt text) */
        #caption {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
            text-align: center;
            color: #ccc;
            padding: 10px 0;
        }

        /* Add Animation - Zoom in */
        .modal-content, #caption {
            animation-name: zoom;
            animation-duration: 0.5s;
        }

        @keyframes zoom {
            from {transform: scale(0.1)}
            to {transform: scale(1)}
        }

        /* The Close Button */
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }

    </style>
</head>
