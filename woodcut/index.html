<style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { 
            text-align: center; 
        }

        /* --- Navigation Styles --- */
        nav {
            width: 100%;
            text-align: center;
            margin-bottom: 30px;
        }
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: inline-block;
        }
        nav li {
            display: inline-block;
        }
        nav a {
            display: block;
            color: #fff;
            text-decoration: none;
            padding: 10px 15px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        nav a:hover, nav a:focus {
            background-color: #333;
            border-radius: 4px;
        }
        nav a.active {
            color: #888;
            cursor: default;
        }
        /* --- End Navigation Styles --- */

        .gallery { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 15px; 
            align-items: flex-start; 
        }
        
        /* --- THUMBNAIL IMAGE STYLE --- */
        .gallery img { 
            width: 300px;
            height: auto;
            display: block; 
            border: none; 
            border-radius: 4px; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); 
            transition: transform 0.3s ease, opacity 0.3s ease; 
            cursor: pointer;
        }

        .gallery img:hover {
            transform: scale(1.03);
            opacity: 0.8;
        }
        
        /* --- Footer Style --- */
        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9em;
            color: #888;
        }

        /* * ---------------------------------
         * --- MODAL (LIGHTBOX) STYLES ---
         * --- Corrected Version ---
         * ---------------------------------
        */

        /* The Modal (background) */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; 
            z-index: 1000; 
            padding-top: 60px; /* Space from top to start of modal box */
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0,0,0,0.9);
        }

        /* Modal Content (The Image) */
        .modal-content {
            margin: auto;
            display: block;
            width: auto;  /* Respect original width */
            height: auto; /* Respect original height */
            
            /* * This is the fix to show original dimensions:
             * We set a max-width and max-height to the *viewport size*.
             * This means small images show at 100% size, and huge
             * images scale *down* to fit the screen, which is
             * the desired behavior.
            */
            max-width: 90vw; /* 90% of viewport width */
            max-height: 85vh; /* 85% of viewport height */
        }

        /* Caption of Modal Image (from alt text) */
        #caption {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
            text-align: center;
            color: #ccc;
            padding: 10px 0;
        }

        /* Add Animation - Zoom in */
        .modal-content, #caption {
            animation-name: zoom;
            animation-duration: 0.5s;
        }

        @keyframes zoom {
            from {transform: scale(0.1)}
            to {transform: scale(1)}
        }

        /* The Close Button */
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }

    </style>
